<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>교사 화면 — AI 답변, 믿어도 될까?</title>
<style>
:root{--main:#1c1c1c;--accent:#c9b18b;--accent-soft:#f1eadd;--accent-dk:#6b5535;--bg:#f4f4f2;--soft:#eeede9;--txt:#1a1a1a;--sub:#6b6b68;--ok:#1a1a1a;--part:#a8875a;--unk:#8a8a86;--bad:#4d4d4d;--line:#dcdcd8}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.6}
header{background:var(--main);color:#fff;border-bottom:3px solid var(--accent);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:1.15rem}.status{display:flex;gap:10px;align-items:center;font-size:.9rem;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.14);padding:4px 11px;border-radius:20px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{flex:1;min-width:100px;border:none;background:#eceae5;color:var(--sub);padding:10px 6px;border-radius:8px;font-size:.95rem;cursor:pointer}
.tabs button.active{background:var(--main);color:#fff;font-weight:700}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:18px}
.card h2{margin:0 0 10px;font-size:1.25rem}h3{margin:18px 0 8px;font-size:1.05rem}
input[type=password],input[type=text],input[type=number],select,textarea{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:.95rem;font-family:inherit;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{background:var(--main);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:.95rem;cursor:pointer}
.btn.ghost{background:#fff;color:var(--main);border:1.5px solid var(--main)}.btn.small{padding:5px 10px;font-size:.85rem}.btn.danger{background:#fff;color:var(--txt);border:1.5px dashed var(--txt)}
.btn:disabled{opacity:.4;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.box{border:1.5px solid var(--line);border-radius:10px;padding:14px;background:#fff}.box h4{margin:0 0 6px;font-size:1rem}
.small{font-size:.9rem;color:var(--sub)}
.timer{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}th{background:var(--soft)}
td input[type=text],td input[type=number],td select{width:100%}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--accent-soft);border-radius:12px;padding:10px 16px;font-weight:600}.chip b{font-size:1.4rem;margin-right:4px}
.chip.warn{background:var(--accent-soft);color:var(--accent-dk);box-shadow:inset 0 0 0 1.5px var(--accent)}
.v{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.85rem;font-weight:700;color:#fff;background:var(--unk)}
.v.ok{background:var(--ok)}.v.part{background:var(--part)}.v.unk{background:var(--unk)}.v.bad{background:#fff;color:var(--txt);box-shadow:inset 0 0 0 1.5px var(--txt)}.v.none{background:#cfcfca}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar .l{width:210px;font-size:.9rem}.bar .t{flex:1;background:var(--accent-soft);border-radius:6px;height:20px;overflow:hidden}.bar .f{height:100%;background:var(--main)}.bar .n{width:70px;text-align:right;font-size:.9rem}
.claim{border-left:5px solid var(--accent);padding:4px 0 4px 14px;margin:14px 0}
.quote{background:#faf9f6;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:.95rem}
.help{background:var(--accent-soft)}
.stagebtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.savebar{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--main);padding:10px 16px;margin:0 -22px -22px;border-radius:0 0 14px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.claimcard{border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#faf9f6}
.srcbox{border:1px dashed var(--accent);border-radius:8px;padding:8px;margin:8px 0}
.lbl{font-size:.85rem;color:var(--sub);margin:6px 0 2px}
details{margin-top:10px}summary{cursor:pointer;font-weight:600;color:var(--main)}
.tab{display:none}.tab.show{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.on{opacity:1}
header select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);padding:4px 8px;border-radius:20px}header select option{color:#111}
.badge.btnlike{cursor:pointer;border:none;color:#fff;font:inherit}
.phase{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:18px}
.phase h2{margin:0 0 10px;font-size:1.05rem}
.pchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pchip{border:1.5px solid var(--line);background:#fff;color:var(--txt);padding:9px 14px;border-radius:22px;font-size:.95rem;cursor:pointer;font-family:inherit}
.pchip.on{background:var(--main);color:#fff;border-color:var(--main);font-weight:700;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--accent)}
.pchip.free{border-style:dashed}
.phrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.stagemode{display:none}
/* 무대 화면: 맨 위 '단계 이름'과 '시계'는 같은 크기로 고정(단계를 넘겨도 위치·크기가 변하지 않음). 그 아래 내용은 남은 공간에 맞춰 크기가 자동 조절(cqh=내용 영역 높이 기준, --k=fitStage가 맞춘 배율) */
body.stagemode-on{background:#111;color:#f4f4f2;font-size:22px;overflow:hidden}
body.stagemode-on header,body.stagemode-on .wrap{display:none!important}
body.stagemode-on #stageView{display:flex}
#stageView{--k:1;display:none;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding:2.2vh 3.6vw;gap:1.2vh;position:relative}
#stageView .sv-top{display:flex;justify-content:space-between;align-items:center;color:var(--accent);font-size:clamp(.75rem,1.6vh,1rem);letter-spacing:.06em;flex:0 0 auto}
#stageView .sv-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3vw;align-items:end;flex:0 0 auto}
#stageView .sv-hl{min-width:0}
#stageView .sv-no,#stageView .sv-time{font-size:clamp(.8rem,1.9vh,1.15rem);line-height:1.5;height:1.5em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#stageView .sv-no{color:var(--accent);font-weight:700;letter-spacing:.04em}
#stageView .sv-time{color:#a8a8a4;text-align:right}
#stageView .sv-name,#stageView .sv-timer{font-size:clamp(2rem,min(5vw,8.5vh),4.5rem);font-weight:800;line-height:1.15;white-space:nowrap}
#stageView .sv-name{overflow:hidden;text-overflow:ellipsis}
#stageView .sv-timer{font-variant-numeric:tabular-nums;color:var(--accent);text-align:right}
#stageView .sv-bar{height:8px;background:#2a2a28;border-radius:4px;overflow:hidden;flex:0 0 auto}
#stageView .sv-bar i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s linear}
#stageView .sv-body{flex:1 1 0;min-height:0;overflow:hidden;container-type:size}
#stageView .sv-inner{display:flex;flex-direction:column;gap:calc(2.2cqh*var(--k))}
#stageView .sv-todo{font-size:var(--tf,1.6rem);letter-spacing:var(--ts,0);line-height:1.4;font-weight:600;color:#f4f4f2;border-left:6px solid var(--accent);padding-left:1.2vw;white-space:nowrap;overflow:hidden}
#stageView .sv-points{display:flex;gap:1.2vh 1vw;flex-wrap:wrap;counter-reset:pt}
#stageView .sv-points div{flex:1;min-width:12vw;display:flex;align-items:center;gap:.7em;background:#1e1e1c;border:1.5px solid #3a3a38;border-radius:14px;padding:1.4vh 1vw;font-size:calc(clamp(1.1rem,min(1.9vw,3.8cqh),1.9rem)*min(var(--k),1));line-height:1.4;counter-increment:pt}
#stageView .sv-points div::before{content:counter(pt);flex:0 0 auto;display:inline-flex;width:1.7em;height:1.7em;align-items:center;justify-content:center;background:var(--accent);color:#111;font-weight:800;border-radius:50%;font-size:.9em}
#stageView .sv-points span{min-width:0;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
#stageView .sv-inner.nopanel{height:100%}
#stageView .sv-inner.nopanel .sv-points{margin:auto 0}
/* 준비·마무리 단계: 카드를 세로로 쌓고 글자를 크게(배율 --k로 화면에 맞춤) */
#stageView .sv-inner.big .sv-points{flex-direction:column;flex-wrap:nowrap;gap:calc(1.6cqh*var(--k))}
#stageView .sv-inner.big .sv-points div{flex:0 0 auto;min-width:0;padding:calc(1.8cqh*var(--k)) 2vw;border-radius:18px;font-size:calc(clamp(1.3rem,min(1.9vw,3.6cqh),2.2rem)*var(--k)*.8)}
#stageView .sv-panel{background:#181816;border:1.5px solid #3a3a38;border-radius:16px;padding:calc(1.8cqh*var(--k)) 1.4vw}
#stageView .sv-panel h3{margin:0 0 calc(1.2cqh*var(--k));font-size:calc(clamp(.85rem,2.6cqh,1.2rem)*var(--k));color:var(--accent);letter-spacing:.04em}
#stageView .sv-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(13vw,1fr));gap:calc(.8vw*var(--k))}
#stageView .sv-g{border:1.5px solid #3a3a38;border-radius:12px;padding:calc(1.2cqh*var(--k)) calc(.8vw*var(--k));background:#1e1e1c;min-width:0}
#stageView .sv-g b{font-size:calc(clamp(.95rem,3cqh,1.35rem)*var(--k))}
#stageView .sv-g p{margin:.3em 0;font-size:calc(clamp(.75rem,2.4cqh,1.05rem)*var(--k));color:#c8c8c4;line-height:1.35;word-break:keep-all;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#stageView[data-clamp="0"] .sv-g p{display:block;-webkit-line-clamp:unset;overflow:visible}
#stageView[data-clamp="2"] .sv-g p{-webkit-line-clamp:2}
#stageView[data-clamp="1"] .sv-g p{-webkit-line-clamp:1}
#stageView .sv-g .m{font-size:calc(clamp(.75rem,2.3cqh,1rem)*var(--k));color:#8a8a86}
#stageView .sv-v{display:inline-block;padding:1px 10px;border-radius:14px;font-size:calc(clamp(.75rem,2.3cqh,1rem)*var(--k));font-weight:700;border:1.5px solid #5a5a58;color:#a8a8a4}
#stageView .sv-v.ok{background:#f4f4f2;border-color:#f4f4f2;color:#111}#stageView .sv-v.part{background:var(--accent);border-color:var(--accent);color:#111}
#stageView .sv-v.unk{border-style:dashed;color:#e8e8e4}#stageView .sv-v.bad{border-color:#f4f4f2;color:#f4f4f2}
#stageView .sv-g.click{cursor:pointer;transition:border-color .15s}
#stageView .sv-g.click:hover{border-color:var(--accent)}
#stageView .sv-inner.spot{height:100%}
#stageView .sv-panel.sv-spot{cursor:pointer;border-color:var(--accent);flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#stageView .sv-focus{display:flex;flex-direction:column;gap:calc(1.6cqh*var(--k));flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:.8vw;scrollbar-width:thin;scrollbar-color:#5a5a58 transparent}
#stageView .sv-fc{font-size:calc(clamp(1rem,2.6cqh,1.5rem)*var(--k));color:#c8c8c4;line-height:1.35;word-break:keep-all;overflow-wrap:break-word}
#stageView .sv-fv .sv-v{font-size:calc(clamp(1rem,3cqh,1.8rem)*var(--k));padding:.05em .8em}
#stageView .sv-fb b{display:block;font-size:calc(clamp(.9rem,2.2cqh,1.2rem)*var(--k));color:var(--accent);letter-spacing:.03em}
#stageView .sv-fb p{margin:.15em 0 0;font-size:calc(clamp(1.2rem,3.8cqh,2.6rem)*var(--k));line-height:1.45;color:#f4f4f2;font-weight:600;word-break:keep-all;overflow-wrap:break-word}
#stageView .sv-fb p .m{font-weight:400}
#stageView .sv-mini{display:flex;gap:.6vw;flex-wrap:wrap;margin-top:calc(1.4cqh*var(--k));flex:0 0 auto}
#stageView .sv-mini span{padding:.3vh .9vw;border:1.5px solid #3a3a38;border-radius:22px;font-size:calc(clamp(.8rem,2cqh,1.1rem)*var(--k));color:#8a8a86;cursor:pointer}
#stageView .sv-mini span.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}
#stageView .sv-prog{height:calc(3.4cqh*var(--k));background:#2a2a28;border-radius:11px;overflow:hidden;margin:calc(1.2cqh*var(--k)) 0}
#stageView .sv-prog i{display:block;height:100%;background:var(--accent)}
#stageView .sv-steps{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
#stageView .sv-steps span{cursor:pointer;transition:border-color .15s;padding:.5vh 1vw;border:1.5px solid #3a3a38;border-radius:22px;color:#8a8a86;font-size:clamp(.75rem,1.8vh,1rem)}
#stageView .sv-steps span:hover{border-color:var(--accent)}
#stageView .sv-steps span.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:800}
#stageView .sv-steps span.past{color:#d8d8d4;border-color:#5a5a58}
#stageView .sv-stat{display:flex;gap:3vw;font-size:clamp(.85rem,2vh,1.2rem);color:#d8d8d4;flex-wrap:wrap;flex:0 0 auto}
#stageView .sv-stat b{font-size:clamp(1.2rem,3.4vh,2.2rem);color:#fff;margin-right:.2em}
#stageView .sv-ctl{position:absolute;right:2vw;bottom:2vh;display:flex;gap:8px;opacity:.35}
#stageView .sv-ctl:hover{opacity:1}
#stageView .sv-ctl button{background:#2a2a28;color:#f4f4f2;border:1px solid #444;padding:.6vh .9vw;border-radius:8px;cursor:pointer;font:inherit;font-size:clamp(.75rem,1.7vh,.9rem)}
/* 학생 코드(학년-반-번호)는 기본으로 흐리게 — 프로젝터에 비쳐도 읽히지 않고, 마우스를 올리거나 클릭하면 보임 */
body.hide-codes .cd{filter:blur(7px);transition:filter .15s}body.hide-codes .cd:hover,body.hide-codes .cd:focus{filter:none}
body.present{font-size:20px}body.present header,body.present .tabs,body.present .nopresent{display:none}
</style></head><body class="hide-codes">
<header>
 <h1>교사 화면 · AI 답변, 믿어도 될까? <span class="small" style="color:#c9b18b">주제탐구독서 · 고2 · 50분</span></h1>
 <div class="status"><select id="classSel" onchange="switchClass(this.value)" title="반 전환"></select><button class="badge btnlike" onclick="newClass()">＋ 새 반</button><button class="badge btnlike" onclick="copyLink()">학생 링크 복사</button><button class="badge btnlike" id="hideBtn" onclick="toggleHide()">🙈 코드 가림 켜짐</button><button class="badge btnlike" onclick="stageMode(true)">무대 화면</button><span class="badge" id="updBadge">-</span></div>
</header>
<div class="wrap">
 <div class="card" id="login" style="max-width:420px;margin:40px auto">
  <h2>교사 확인</h2>
  <p class="small">교사 PIN을 입력하세요.</p>
  <form onsubmit="login();return false"><input type="password" id="pin" placeholder="PIN" autocomplete="off" style="width:100%">
  <div style="margin-top:12px;text-align:right"><button class="btn" type="submit">들어가기</button></div></form>
  <p class="small" id="loginMsg"></p>
 </div>

 <div id="app" style="display:none">
  <div class="phase">
   <h2>지금 학생에게 보여 줄 단계 <span class="small" id="phaseInfo"></span></h2>
   <div class="pchips" id="pchips"></div>
   <div class="phrow">
    <button class="btn small ghost" id="prevBtn" onclick="stepStage(-1)">◀ 이전 단계</button><button class="btn small" id="nextBtn" onclick="stepStage(1)">다음 단계 ▶</button>
    <span class="timer" id="timer" style="font-size:1.8rem">00:00</span>
    <span class="small" id="clockInfo"></span> <button class="btn small ghost" id="clockBtn" onclick="toggleClock()">▶ 수업 시작</button>
   </div>
   <div class="phrow"><span class="small" id="flowInfo"></span></div>
   <div class="phrow"><button class="btn small" id="shareBtn" onclick="toggleShare()">-</button><span class="small">5단계 모둠 판정 공개 — 켜면 학생 5단계 표에 다른 모둠 판정이 채워져요. 발표가 끝난 뒤 공개하세요.</span></div>
  </div>
  <div class="tabs" id="tabs"></div>

  <section class="tab" id="tab1"><div id="live"></div></section>
  <section class="tab" id="tab2"><div id="results"></div></section>
  <section class="tab" id="tab3"><div id="settings"></div></section>

  <section class="tab" id="tab4">
   <div class="card">
    <h2>데이터 내보내기</h2>
    <p class="small">엑셀에서 바로 열 수 있는 CSV와, 원본 그대로의 JSON을 받을 수 있어요. 스프레드시트(‘학생응답’·‘모둠기록지’ 시트)에도 같은 데이터가 쌓여 있습니다.</p>
    <button class="btn" onclick="exportCSV('students')">학생 응답 CSV</button>
    <button class="btn" onclick="exportCSV('groups')">모둠 기록지 CSV</button>
    <button class="btn ghost" onclick="exportJSON()">전체 JSON</button>
   </div>
  </section>

 </div>
</div>
<div id="stageView"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script><script src="content.js"></script><script src="lesson.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const wj=s=>String(s==null?'':s).split(/(\s+)/).map(t=>/\s/.test(t)||t.length>16?t:[...t].join('\u2060')).join(''); // 어절 안에서 줄이 바뀌지 않게(무대 화면 카드용)
const PIN_KEY='aiverify_teacher_pin';
const BASE=location.origin+location.pathname.replace(/[^/]*$/,'');
let pin='',DB=null,LS=normLesson(null),DR=null,dirty=false,poll=null,ROWS=[];
const TABS=['📊 현황','📝 결과 정리','⚙️ 수업 설정','📁 데이터'];
const OPEN={}; // 수업 설정에서 펼쳐 둔 섹션 기억
const QS=new URLSearchParams(location.search);
const VCLS={'확인됨':'ok','부분적으로 맞음':'part','확인 불가':'unk','사실 아님':'bad'};
const PRE=['그대로 인용해도 된다','일부는 확인이 필요하다','인용하면 안 된다'];
const POST=['그대로 인용해도 된다','수정·출처 표시 후 부분 인용','인용하지 않는다'];
const SELF=['AI 답변에서 확인이 필요한 문장을 골라낼 수 있다.','여러 자료를 비교해 ‘확인됨·부분적으로 맞음·확인 불가·사실 아님’을 구분할 수 있다.','자료를 만든 주체와 이해관계를 고려해 신뢰성을 판단할 수 있다.','판정 결과에 맞게 출처와 조건을 넣어 문장을 고쳐 활용할 수 있다.','모둠 탐구와 공유에 적극적으로 참여했다.'];
const vBadge=v=>`<span class="v ${VCLS[v]||'none'}">${esc(v||'미판정')}</span>`;
const hms=t=>t?new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'-';
const CLN=()=>claimsOf(LS);

  return `<div class="sv-panel"><h3>모둠 발표 · 판정 ${DB.shareOpen?'공개 중':'(공개 전 — 발표가 끝나면 공개하세요)'} <span class="m">· 모둠 카드를 누르면 발표 내용이 크게 보여요</span></h3><div class="sv-groups">${G.map(gr=>card(gr,f=>DB.shareOpen?vb(f.g_verdict&&f.g_verdict.v)+`<p>${esc(wj((f.g_reason&&f.g_reason.v)||''))}</p>`:'<span class="m">발표 대기</span>',true)).join('')}</div></div>`;}

/* 맨 위 단계 이름·시계는 고정 크기. 그 아래 내용은 남은 공간에 맞춰 --k(0.5~2.2배)로 자동 조절: 짧은 단계는 키우고, 긴 단계는 줄이고, 그래도 넘치면 카드 문장을 1줄로 */
/* '지금 할 일' 문장을 한 줄에 맞춤: 먼저 자간을 조금씩 좁히고(최대 -0.05em), 그래도 넘치면 글자 크기를 줄임 */
function fitTodo(v){const t=v.querySelector('.sv-todo');if(!t)return;
 const base=Math.max(19,Math.min(innerWidth*.026,innerHeight*.046,42))*(v.querySelector('.sv-inner.big')?1.35:1);
 t.style.setProperty('--tf',base+'px');t.style.setProperty('--ts','0em');
 const over=()=>t.scrollWidth>t.clientWidth+1;
 let ls=0;while(over()&&ls>-0.05){ls=Math.round((ls-.01)*100)/100;t.style.setProperty('--ts',ls+'em');}
 let f=base;while(over()&&f>12){f-=1;t.style.setProperty('--tf',f+'px');}}
function fitStage(){const v=$('stageView');if(!v||getComputedStyle(v).display==='none')return;
 fitTodo(v);
 const foc=v.querySelector('.sv-spot .sv-focus');
 if(foc){v.removeAttribute('data-clamp');for(let k=1.8;k>=1;k=Math.round((k-.05)*100)/100){v.style.setProperty('--k',k);if(foc.scrollHeight<=foc.clientHeight+1)return;}v.style.setProperty('--k',1);return;} // 1배로도 길면 스크롤
 const body=v.querySelector('.sv-body'),inner=v.querySelector('.sv-inner');if(!body||!inner)return;
 const fits=()=>inner.scrollHeight<=body.clientHeight+1&&v.scrollHeight<=v.clientHeight+1;
 const tryK=from=>{for(let k=from;k>=.5;k=Math.round((k-.05)*100)/100){v.style.setProperty('--k',k);if(fits())return true;}return false;};
 /* 카드 문장은 가능하면 전부 보이게(글자는 너무 작아지지 않는 범위에서), 안 되면 3줄 → 2줄 → 1줄로 줄임 */
 for(const [c,min] of [['0',1],['3',.85],['2',.7]]){v.setAttribute('data-clamp',c);
  for(let k=2.2;k>=min;k=Math.round((k-.05)*100)/100){v.style.setProperty('--k',k);if(fits())return;}}
 v.setAttribute('data-clamp','1');tryK(1);}
window.addEventListener('resize',fitStage);

 (DB.roster||[]).forEach(r=>{if(!known[r.code])rows.push({code:r.code,group:r.group,live:false});});return rows;}

function moveStage(i,d){const j=i+d;if(j<0||j>=DR.stages.length||DR.stages[i].id===0||DR.stages[j].id===0)return;[DR.stages[i],DR.stages[j]]=[DR.stages[j],DR.stages[i]];mark();renderSettings();}
function addGroup(){if(DR.groups.length>=MAX_GROUPS)return;DR.groups.push({n:DR.groups.length+1,size:4,claim:1});mark();renderSettings();}
function delGroup(){if(DR.groups.length<=1)return;const g=DR.groups[DR.groups.length-1];
 if(!confirm(`${g.n}모둠을 삭제할까요? 이미 ${g.n}모둠으로 접속한 학생은 모둠을 다시 골라야 해요.`))return;DR.groups.pop();mark();renderSettings();}
function startEditClaims(){DR.claims=clone(CLAIMS);mark();renderSettings();}
function resetClaims(){if(!confirm('편집한 주장·자료를 모두 지우고 기본 자료로 되돌릴까요? (저장 전까지는 학생 화면에 영향이 없어요)'))return;DR.claims=null;DR.groups.forEach(g=>{if(g.claim>CLAIMS.length)g.claim=1;});mark();renderSettings();}
function addClaim(){if(DR.claims.length>=MAX_CLAIMS)return;DR.claims.push({n:DR.claims.length+1,t:'',hint:'',src:[{type:'',title:'',body:''}]});mark();renderSettings();}
function delClaim(ci){if(DR.claims.length<=1)return;if(!confirm(`주장 ${ci+1}을(를) 삭제할까요?`))return;
 DR.claims.splice(ci,1);DR.claims.forEach((c,i)=>c.n=i+1);
 DR.groups.forEach(g=>{if(g.claim===ci+1)g.claim=1;else if(g.claim>ci+1)g.claim--;});mark();renderSettings();}
function addSrc(ci){const c=DR.claims[ci];if(c.src.length>=MAX_SRC)return;c.src.push({type:'',title:'',body:''});mark();renderSettings();}
function delSrc(ci,si){const c=DR.claims[ci];if(c.src.length<=1)return;c.src.splice(si,1);mark();renderSettings();}
async function saveSettings(){
 const CL=claimsOf(DR);
 for(const c of CL){if(!String(c.t).trim()){toast(`주장 ${c.n}의 AI 답변 문장이 비어 있어요`);return;}}
 DR.stages.forEach(s=>{s.name=String(s.name).trim()||DEFAULT_LESSON.stages.find(d=>d.id===s.id).name;});
 const r=await api('setLesson',{lesson:DR});
 if(r.ok){dirty=false;toast('저장했어요. 학생 화면에 곧 반영돼요');await refresh(true);}else toast(r.error==='too large'?'내용이 너무 길어요. 자료를 줄여 주세요':'저장하지 못했어요');
}
function cancelSettings(){if(dirty&&!confirm('저장하지 않은 변경을 버릴까요?'))return;dirty=false;DR=clone(LS);renderSettings();}
function parseRoster(text){const list=[],bad=[];
 text.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;const p=line.split(/[\s,;\t]+/).filter(Boolean);
  const g=parseInt(String(p[1]||'').replace(/[^\d]/g,''),10);if(p.length<2||!g||g<1||g>LS.groups.length)bad.push(line);else list.push({code:p[0],group:g});});
 return{list,bad};}
async function saveRoster(mode){
 const {list,bad}=parseRoster($('rosterText').value);
 if(bad.length){toast(`형식·모둠 번호가 맞지 않는 줄이 ${bad.length}개 있어요: ${bad[0]}`);return;}
 if(!list.length&&mode!=='replace'){toast('등록할 명단을 붙여 넣어 주세요');return;}
 if(mode==='replace'&&!confirm(list.length?`기존 명단을 지우고 ${list.length}명으로 교체할까요?`:'명단을 모두 비울까요?'))return;
 const r=await api('setRoster',{list,mode});
 if(r.ok){toast(`명단 ${r.count}명 등록됨`);$('rosterText').value='';refresh();}else toast('저장하지 못했어요');
}

/* ---- 타이머 ---- */
/* ---- 수업 시계: '수업 시작'을 누른 순간부터 끝까지 흘러가는 시간. 표시·확인용일 뿐, 단계를 막거나 넘기지 않음 ---- */
let CLOCK=0,OFFSET=0; // CLOCK=시작 시각(서버 ms, 0=아직 시작 전), OFFSET=서버 시계 − 이 기기 시계
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const elapsed=()=>CLOCK?Math.max(0,Math.floor((Date.now()+OFFSET-CLOCK)/1000)):0;
const totalSec=()=>visStages(LS).reduce((a,s)=>{const m=String(s.time).match(/(\d+)\s*분/);return a+(m?+m[1]:0);},0)*60;
const clockPct=()=>totalSec()?Math.min(100,Math.round(elapsed()/totalSec()*100)):0;
function clockText(st){const T=totalSec(),e=elapsed(),parts=[];
 if(st)parts.push('이 단계 권장 '+st.time);
 if(!CLOCK)parts.push("'수업 시작'을 누르면 시간이 흘러가요");
 else if(T)parts.push(e<=T?'수업 '+Math.round(T/60)+'분 중 남은 '+fmt(T-e):fmt(e-T)+' 초과');
 return parts.join(' · ');}
async function toggleClock(){
 if(CLOCK&&!confirm('수업 시계를 처음(00:00)으로 되돌릴까요?'))return;
 const r=await api('setClock',{on:!CLOCK});
 if(r.ok)await refresh();else toast('시계를 바꾸지 못했어요. Apps Script를 새 버전으로 배포했는지 확인해 주세요');}
function tick(){const t=$('timer');if(!t)return;const txt=fmt(elapsed()),T=totalSec(),over=CLOCK&&T&&elapsed()>T;
 t.textContent=txt;t.style.color=over?'#a8875a':'';
 $('clockBtn').textContent=CLOCK?'시계 초기화':'▶ 수업 시작';
 $('clockInfo').textContent=clockText(null);
 const sv=$('stageTimer'),sb=$('stageBar'),st=$('svTime');if(sv)sv.textContent=txt;if(sb)sb.style.width=clockPct()+'%';
 if(st){const s=visStages(LS).find(x=>x.id===LS.current);st.textContent=clockText(s);}}
setInterval(tick,1000);

try{const p=sessionStorage.getItem(PIN_KEY);if(p&&API_URL){$('pin').value=p;login();}}catch(e){}
