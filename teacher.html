<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>교사 화면 — AI 답변, 믿어도 될까?</title>
<style>
:root{--main:#1c1c1c;--accent:#c9b18b;--accent-soft:#f1eadd;--accent-dk:#6b5535;--bg:#f4f4f2;--soft:#eeede9;--txt:#1a1a1a;--sub:#6b6b68;--ok:#1a1a1a;--part:#a8875a;--unk:#8a8a86;--bad:#4d4d4d;--line:#dcdcd8}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.6}
header{background:var(--main);color:#fff;border-bottom:3px solid var(--accent);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:1.15rem}.status{display:flex;gap:10px;align-items:center;font-size:.9rem;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.14);padding:4px 11px;border-radius:20px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{flex:1;min-width:100px;border:none;background:#eceae5;color:var(--sub);padding:10px 6px;border-radius:8px;font-size:.95rem;cursor:pointer}
.tabs button.active{background:var(--main);color:#fff;font-weight:700}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:18px}
.card h2{margin:0 0 10px;font-size:1.25rem}h3{margin:18px 0 8px;font-size:1.05rem}
input[type=password],input[type=text],input[type=number],select,textarea{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:.95rem;font-family:inherit;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{background:var(--main);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:.95rem;cursor:pointer}
.btn.ghost{background:#fff;color:var(--main);border:1.5px solid var(--main)}.btn.small{padding:5px 10px;font-size:.85rem}.btn.danger{background:#fff;color:var(--txt);border:1.5px dashed var(--txt)}
.btn:disabled{opacity:.4;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.box{border:1.5px solid var(--line);border-radius:10px;padding:14px;background:#fff}.box h4{margin:0 0 6px;font-size:1rem}
.small{font-size:.9rem;color:var(--sub)}
.timer{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}th{background:var(--soft)}
td input[type=text],td input[type=number],td select{width:100%}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--accent-soft);border-radius:12px;padding:10px 16px;font-weight:600}.chip b{font-size:1.4rem;margin-right:4px}
.chip.warn{background:var(--accent-soft);color:var(--accent-dk);box-shadow:inset 0 0 0 1.5px var(--accent)}
.v{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.85rem;font-weight:700;color:#fff;background:var(--unk)}
.v.ok{background:var(--ok)}.v.part{background:var(--part)}.v.unk{background:var(--unk)}.v.bad{background:#fff;color:var(--txt);box-shadow:inset 0 0 0 1.5px var(--txt)}.v.none{background:#cfcfca}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar .l{width:210px;font-size:.9rem}.bar .t{flex:1;background:var(--accent-soft);border-radius:6px;height:20px;overflow:hidden}.bar .f{height:100%;background:var(--main)}.bar .n{width:70px;text-align:right;font-size:.9rem}
.claim{border-left:5px solid var(--accent);padding:4px 0 4px 14px;margin:14px 0}
.quote{background:#faf9f6;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:.95rem}
.help{background:var(--accent-soft)}
.stagebtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.savebar{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--main);padding:10px 16px;margin:0 -22px -22px;border-radius:0 0 14px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.claimcard{border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#faf9f6}
.srcbox{border:1px dashed var(--accent);border-radius:8px;padding:8px;margin:8px 0}
.lbl{font-size:.85rem;color:var(--sub);margin:6px 0 2px}
details{margin-top:10px}summary{cursor:pointer;font-weight:600;color:var(--main)}
.tab{display:none}.tab.show{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.on{opacity:1}
header select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);padding:4px 8px;border-radius:20px}header select option{color:#111}
.badge.btnlike{cursor:pointer;border:none;color:#fff;font:inherit}
.phase{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:18px}
.phase h2{margin:0 0 10px;font-size:1.05rem}
.pchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pchip{border:1.5px solid var(--line);background:#fff;color:var(--txt);padding:9px 14px;border-radius:22px;font-size:.95rem;cursor:pointer;font-family:inherit}
.pchip.on{background:var(--main);color:#fff;border-color:var(--main);font-weight:700;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--accent)}
.pchip.free{border-style:dashed}
.phrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.stagemode{display:none}
body.stagemode-on{background:#111;color:#f4f4f2;font-size:22px}
body.stagemode-on header,body.stagemode-on .wrap{display:none!important}
body.stagemode-on #stageView{display:flex}
#stageView{display:none;flex-direction:column;min-height:100vh;padding:3.5vh 4.5vw;gap:2.6vh;position:relative}
#stageView .sv-top{display:flex;justify-content:space-between;align-items:center;color:var(--accent);font-size:1.05rem;letter-spacing:.06em}
#stageView .sv-main{display:grid;grid-template-columns:1.5fr 1fr;gap:4vw;align-items:center}
@media(max-width:900px){#stageView .sv-main{grid-template-columns:1fr}}
#stageView .sv-no{color:var(--accent);font-size:1.5rem;font-weight:700;letter-spacing:.04em}
#stageView .sv-name{font-size:clamp(3rem,8vw,6.5rem);font-weight:800;line-height:1.1;margin:.08em 0 .15em}
#stageView .sv-todo{font-size:clamp(1.5rem,2.6vw,2.4rem);line-height:1.45;font-weight:600;color:#f4f4f2;border-left:6px solid var(--accent);padding-left:1.2vw}
#stageView .sv-clock{text-align:right}
#stageView .sv-timer{font-size:clamp(4rem,11vw,9rem);font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
#stageView .sv-time{font-size:1.2rem;color:#a8a8a4;margin:.3em 0 .6em}
#stageView .sv-bar{height:12px;background:#2a2a28;border-radius:6px;overflow:hidden}
#stageView .sv-bar i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s linear}
#stageView .sv-points{display:flex;gap:1.2vw;flex-wrap:wrap;counter-reset:pt}
#stageView .sv-points div{flex:1;min-width:14vw;background:#1e1e1c;border:1.5px solid #3a3a38;border-radius:14px;padding:1.4vh 1.2vw;font-size:clamp(1.1rem,1.7vw,1.6rem);line-height:1.4;counter-increment:pt}
#stageView .sv-points div::before{content:counter(pt);display:inline-flex;width:1.7em;height:1.7em;align-items:center;justify-content:center;background:var(--accent);color:#111;font-weight:800;border-radius:50%;margin-right:.6em;font-size:.9em}
#stageView .sv-panel{background:#181816;border:1.5px solid #3a3a38;border-radius:16px;padding:2vh 1.6vw}
#stageView .sv-panel h3{margin:0 0 1.2vh;font-size:1.15rem;color:var(--accent);letter-spacing:.04em}
#stageView .sv-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(15vw,1fr));gap:1vw}
#stageView .sv-g{border:1.5px solid #3a3a38;border-radius:12px;padding:1.2vh 1vw;background:#1e1e1c}
#stageView .sv-g b{font-size:1.3rem}
#stageView .sv-g p{margin:.4em 0;font-size:1rem;color:#c8c8c4;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#stageView .sv-g .m{font-size:.95rem;color:#8a8a86}
#stageView .sv-v{display:inline-block;padding:2px 12px;border-radius:14px;font-size:.95rem;font-weight:700;border:1.5px solid #5a5a58;color:#a8a8a4}
#stageView .sv-v.ok{background:#f4f4f2;border-color:#f4f4f2;color:#111}#stageView .sv-v.part{background:var(--accent);border-color:var(--accent);color:#111}
#stageView .sv-v.unk{border-style:dashed;color:#e8e8e4}#stageView .sv-v.bad{border-color:#f4f4f2;color:#f4f4f2}
#stageView .sv-prog{height:22px;background:#2a2a28;border-radius:11px;overflow:hidden;margin:1vh 0}
#stageView .sv-prog i{display:block;height:100%;background:var(--accent)}
#stageView .sv-steps{display:flex;gap:8px;flex-wrap:wrap}
#stageView .sv-steps span{padding:8px 16px;border:1.5px solid #3a3a38;border-radius:22px;color:#8a8a86;font-size:1rem}
#stageView .sv-steps span.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:800}
#stageView .sv-steps span.past{color:#d8d8d4;border-color:#5a5a58}
#stageView .sv-stat{display:flex;gap:4vw;font-size:1.25rem;color:#d8d8d4;flex-wrap:wrap}
#stageView .sv-stat b{font-size:2.4rem;color:#fff;margin-right:.2em}
#stageView .sv-ctl{position:absolute;right:2vw;bottom:2vh;display:flex;gap:8px;opacity:.35}
#stageView .sv-ctl:hover{opacity:1}
#stageView .sv-ctl button{background:#2a2a28;color:#f4f4f2;border:1px solid #444;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:.9rem}
body.present{font-size:20px}body.present header,body.present .tabs,body.present .nopresent{display:none}
</style></head><body>
<header>
 <h1>교사 화면 · AI 답변, 믿어도 될까? <span class="small" style="color:#c9b18b">주제탐구독서 · 고2 · 50분</span></h1>
 <div class="status"><select id="classSel" onchange="switchClass(this.value)" title="반 전환"></select><button class="badge btnlike" onclick="newClass()">＋ 새 반</button><button class="badge btnlike" onclick="copyLink()">학생 링크 복사</button><button class="badge btnlike" onclick="stageMode(true)">무대 화면</button><span class="badge" id="updBadge">-</span></div>
</header>
<div class="wrap">
 <div class="card" id="login" style="max-width:420px;margin:40px auto">
  <h2>교사 확인</h2>
  <p class="small">교사 PIN을 입력하세요.</p>
  <form onsubmit="login();return false"><input type="password" id="pin" placeholder="PIN" autocomplete="off" style="width:100%">
  <div style="margin-top:12px;text-align:right"><button class="btn" type="submit">들어가기</button></div></form>
  <p class="small" id="loginMsg"></p>
 </div>

 <div id="app" style="display:none">
  <div class="phase">
   <h2>지금 학생에게 보여 줄 단계 <span class="small" id="phaseInfo"></span></h2>
   <div class="pchips" id="pchips"></div>
   <div class="phrow">
    <button class="btn small ghost" id="prevBtn" onclick="stepStage(-1)">◀ 이전 단계</button><button class="btn small" id="nextBtn" onclick="stepStage(1)">다음 단계 ▶</button>
    <span class="timer" id="timer" style="font-size:1.8rem">00:00</span>
    <button class="btn small ghost" id="stageTimerBtn" onclick="startStageTimer()">이 단계 타이머</button> <button class="btn small ghost" onclick="startTimer(120)">2분</button><button class="btn small ghost" onclick="startTimer(300)">5분</button><button class="btn small ghost" onclick="startTimer(600)">10분</button> <button class="btn small ghost" onclick="stopTimer()">정지</button>
   </div>
   <div class="phrow"><span class="small" id="flowInfo"></span></div>
   <div class="phrow"><button class="btn small" id="shareBtn" onclick="toggleShare()">-</button><span class="small">5단계 모둠 판정 공개 — 켜면 학생 5단계 표에 다른 모둠 판정이 채워져요. 발표가 끝난 뒤 공개하세요.</span></div>
  </div>
  <div class="tabs" id="tabs"></div>

  <section class="tab" id="tab1"><div id="live"></div></section>
  <section class="tab" id="tab2"><div id="results"></div></section>
  <section class="tab" id="tab3"><div id="settings"></div></section>

  <section class="tab" id="tab4">
   <div class="card">
    <h2>데이터 내보내기</h2>
    <p class="small">엑셀에서 바로 열 수 있는 CSV와, 원본 그대로의 JSON을 받을 수 있어요. 스프레드시트(‘학생응답’·‘모둠기록지’ 시트)에도 같은 데이터가 쌓여 있습니다.</p>
    <button class="btn" onclick="exportCSV('students')">학생 응답 CSV</button>
    <button class="btn" onclick="exportCSV('groups')">모둠 기록지 CSV</button>
    <button class="btn ghost" onclick="exportJSON()">전체 JSON</button>
   </div>
  </section>

 </div>
</div>
<div id="stageView"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script><script src="content.js"></script><script src="lesson.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const PIN_KEY='aiverify_teacher_pin';
const BASE=location.origin+location.pathname.replace(/[^/]*$/,'');
let pin='',DB=null,LS=normLesson(null),DR=null,dirty=false,poll=null,ROWS=[];
const TABS=['📊 현황','📝 결과 정리','⚙️ 수업 설정','📁 데이터'];
const OPEN={}; // 수업 설정에서 펼쳐 둔 섹션 기억
const QS=new URLSearchParams(location.search);
const VCLS={'확인됨':'ok','부분적으로 맞음':'part','확인 불가':'unk','사실 아님':'bad'};
const PRE=['그대로 인용해도 된다','일부는 확인이 필요하다','인용하면 안 된다'];
const POST=['그대로 인용해도 된다','수정·출처 표시 후 부분 인용','인용하지 않는다'];
const SELF=['AI 답변에서 확인이 필요한 문장을 골라낼 수 있다.','여러 자료를 비교해 ‘확인됨·부분적으로 맞음·확인 불가·사실 아님’을 구분할 수 있다.','자료를 만든 주체와 이해관계를 고려해 신뢰성을 판단할 수 있다.','판정 결과에 맞게 출처와 조건을 넣어 문장을 고쳐 활용할 수 있다.','모둠 탐구와 공유에 적극적으로 참여했다.'];
const vBadge=v=>`<span class="v ${VCLS[v]||'none'}">${esc(v||'미판정')}</span>`;
const hms=t=>t?new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'-';
const CLN=()=>claimsOf(LS);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400);}

async function api(action,payload){
 const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,pin,class:CLASS_ID},payload||{}))});
 return r.json();
}
async function login(){
 if(!API_URL){$('loginMsg').textContent='config.js 의 API_URL 이 비어 있어요. 서버(Apps Script) 주소를 먼저 넣어 주세요.';return;}
 pin=$('pin').value.trim();if(!pin)return;$('loginMsg').textContent='확인 중…';
 try{if(!await refresh(true)){$('loginMsg').textContent='PIN이 맞지 않거나 잠시 잠겨 있어요.';return;}}
 catch(e){$('loginMsg').textContent='서버에 연결하지 못했어요.';return;}
 try{sessionStorage.setItem(PIN_KEY,pin);}catch(e){}
 $('login').style.display='none';$('app').style.display='block';buildTabs();showTab(0);if(QS.get('view')==='stage')stageMode(true);
 poll=setInterval(()=>{if(!document.hidden)refresh().catch(()=>{});},6000);
}
const typing=el=>el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
async function refresh(force){
 const r=await api('teacherAll');if(!r.ok)return false;DB=r;LS=normLesson(r.lesson);
 $('updBadge').textContent='갱신 '+hms(Date.now());$('shareBtn').textContent=r.shareOpen?'🔓 공개 중 (누르면 비공개)':'🔒 비공개 (누르면 공개)';
 if(force||!dirty){if(force||!typing(document.activeElement)||!$('settings').contains(document.activeElement)){DR=clone(LS);dirty=false;renderSettings();}}
 renderClasses();renderControl();renderStageView();
 renderLive();
 renderResults();return true;
}
async function toggleShare(){const r=await api('setShare',{open:!DB.shareOpen});if(r.ok){toast(r.shareOpen?'모둠 판정을 공개했어요':'비공개로 바꿨어요');refresh();}else toast('실패했어요');}
async function clearHelp(i){await api('helpClear',{code:HELP[i].code});refresh();}
function buildTabs(){$('tabs').innerHTML=TABS.map((n,i)=>`<button onclick="showTab(${i})">${n}</button>`).join('');}
function showTab(i){document.querySelectorAll('.tab').forEach((s,j)=>s.classList.toggle('show',i===j));document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('active',i===j));}

/* ---- 반 전환 · 학생 링크 ---- */
const clsLabel=c=>c||'기본 반';
const studentLink=()=>BASE+'index.html'+(CLASS_ID?'?class='+encodeURIComponent(CLASS_ID):'');
function renderClasses(){
 const list=Array.from(new Set([''].concat(DB.classes||[],[CLASS_ID])));
 $('classSel').innerHTML=list.map(c=>`<option value="${esc(c)}" ${c===CLASS_ID?'selected':''}>${esc(clsLabel(c))}</option>`).join('');
}
function goClass(c){const u=new URL(location.href);if(c)u.searchParams.set('class',c);else u.searchParams.delete('class');location.href=u.toString();}
function switchClass(c){if(dirty&&!confirm('저장하지 않은 설정 변경이 있어요. 반을 바꿀까요?')){renderClasses();return;}goClass(c);}
function newClass(){const c=(prompt('새 반 이름을 입력하세요 (예: 1-3, 2반). 영문·숫자·한글·-_ 만 쓸 수 있어요.')||'').replace(/[^A-Za-z0-9가-힣_-]/g,'').slice(0,20);if(c)switchClass(c);}
async function copyLink(){const u=studentLink();try{await navigator.clipboard.writeText(u);toast(clsLabel(CLASS_ID)+' 학생 링크를 복사했어요');}catch(e){prompt('이 주소를 복사해 학생에게 알려 주세요',u);}}

/* ---- 진행 통제: 교사가 '현재 단계'를 지정하면 학생은 그 단계 화면만 본다 ---- */
function renderControl(){
 const vs=visStages(LS),cur=LS.current,pos=vs.findIndex(s=>s.id===cur);
 $('phaseInfo').textContent=cur==null?'· 제한 없음(학생이 자유롭게 이동)':'· '+clsLabel(CLASS_ID)+' 학생 화면이 이 단계로 고정돼 있어요';
 $('pchips').innerHTML=vs.map((s,p)=>`<button class="pchip ${cur===s.id?'on':''}" onclick="setStage(${s.id})">${p+1}. ${esc(s.name)} <span class="small" style="color:inherit;opacity:.7">${esc(s.time)}</span></button>`).join('')
  +`<button class="pchip free ${cur==null?'on':''}" onclick="setStage(null)">자유 이동</button>`;
 $('prevBtn').disabled=cur==null||pos<=0;$('nextBtn').disabled=cur==null||pos>=vs.length-1;
 $('stageTimerBtn').style.display=stageMinutes()?'':'none';$('stageTimerBtn').textContent='이 단계 타이머 '+stageMinutes()+'분';
 $('flowInfo').innerHTML=`<b>모둠 편성:</b> ${LS.groups.map(g=>`${g.n}모둠 ${g.size}명(주장 ${g.claim})`).join(' · ')}`;
}
async function setStage(id){const r=await api('setStage',{stage:id});
 if(r.ok){const s=LS.stages.find(x=>x.id===id);toast(id==null?'학생이 자유롭게 이동할 수 있어요':`학생 화면을 「${s?s.name:''}」 단계로 넘겼어요`);await refresh();}
 else toast('바꾸지 못했어요. Apps Script를 새 버전으로 배포했는지 확인해 주세요');}
function stepStage(d){const vs=visStages(LS),pos=vs.findIndex(s=>s.id===LS.current),t=vs[pos+d];if(t)setStage(t.id);}
function stageMinutes(){const s=LS.stages.find(x=>x.id===LS.current);const m=s&&String(s.time).match(/(\d+)\s*분/);return m?+m[1]:0;}
function startStageTimer(){const m=stageMinutes();if(m)startTimer(m*60);}

/* ---- 무대 화면(프로젝터용): 큰 글씨로 현재 단계·타이머·참여 현황 ---- */

  return `<div class="sv-g"><b>${gr.n}모둠</b> <span class="m">${m}/${gr.size}명</span><p>${c?esc(c.n+'. '+c.t):''}</p>${extra(f)}</div>`;};

 if(id===4)return `<div class="sv-panel"><h3>모둠 발표 · 판정 ${DB.shareOpen?'공개 중':'(공개 전 — 발표가 끝나면 공개하세요)'}</h3><div class="sv-groups">${G.map(gr=>card(gr,f=>DB.shareOpen?vb(f.g_verdict&&f.g_verdict.v)+`<p>${esc((f.g_reason&&f.g_reason.v)||'')}</p>`:'<span class="m">발표 대기</span>')).join('')}</div></div>`;
 if(id===5){const n=S.length,d=S.filter(submitted).length;return `<div class="sv-panel"><h3>제출 현황</h3><div class="sv-prog"><i style="width:${n?Math.round(d/n*100):0}%"></i></div><div style="font-size:1.6rem"><b>${d}</b> / ${n}명 제출</div></div>`;}
 if(id===2)return `<div class="sv-panel"><h3>판정 4단계</h3><div class="sv-groups"><div class="sv-g"><span class="sv-v ok">확인됨</span><p>신뢰할 수 있는 자료와 일치</p></div><div class="sv-g"><span class="sv-v part">부분적으로 맞음</span><p>맞지만 조건·범위 설명이 빠짐</p></div><div class="sv-g"><span class="sv-v unk">확인 불가</span><p>출처를 찾을 수 없음</p></div><div class="sv-g"><span class="sv-v bad">사실 아님</span><p>신뢰할 수 있는 자료와 어긋남</p></div></div></div>`;

 if(!DB)return;const vs=visStages(LS),cur=LS.current,pos=vs.findIndex(s=>s.id===cur),st=vs[pos],S=DB.students,help=S.filter(x=>x.helpAt).length,g=st&&STAGE_GUIDE[st.id];

   <div class="sv-clock"><div class="sv-timer" id="stageTimer">${$('timer').textContent}</div><div class="sv-time">${st?'권장 '+esc(st.time):''}</div><div class="sv-bar"><i id="stageBar" style="width:${pct}%"></i></div></div></div>

async function saveRow(i){const r=ROWS[i],nc=$('rc'+i).value.trim(),ng=+$('rg'+i).value;if(!nc){toast('코드를 입력해 주세요');return;}

 const res=await api('deleteStudent',{code:r.code});if(res.ok){toast('삭제했어요');refresh(true);}else toast('삭제하지 못했어요');}

 h+=`<details class="acc" id="a4" ${OPEN.a4?'open':''}><summary>④ 학생 명단 · 입장 방식 <span class="small">등록 ${(DB.roster||[]).length}명${DR.rosterOnly?' · 명단만 입장':''}</span></summary><div class="accbody">
  <p class="small">한 줄에 <b>참여코드, 모둠</b>을 적어 붙여 넣으세요. (예: <code>2-3-07, 2</code> 또는 엑셀에서 복사한 두 칸) 명단에 있는 코드는 <b>항상 그 모둠</b>으로 배정돼요. 이미 접속한 학생의 모둠도 함께 바뀝니다. 개별 수정은 아래 ‘⑤ 학생 관리’에서 할 수 있어요. 현재 등록: <b>${(DB.roster||[]).length}명</b></p>
  <textarea id="rosterText" style="min-height:120px" placeholder="2-3-01, 1&#10;2-3-02, 1&#10;2-3-03, 2"></textarea>
  <div style="margin:8px 0"><button class="btn small" onclick="saveRoster('merge')">추가·수정 (기존 명단 유지)</button> <button class="btn small danger" onclick="saveRoster('replace')">전체 교체</button></div>
  <label><input type="checkbox" ${DR.rosterOnly?'checked':''} onchange="DR.rosterOnly=this.checked;mark()"> 명단에 등록된 참여 코드만 입장 허용 (아래 ‘저장’을 눌러야 적용)</label></div></details>`;

 h+=`<details class="acc" id="a5" ${OPEN.a5?'open':''}><summary>⑤ 학생 관리 <span class="small">접속 ${DB.students.length}명 · 코드/모둠 수정·삭제</span></summary><div class="accbody"><div id="studentMgr"></div></div></details>`;

 h+=`<div class="card" style="padding-bottom:0"><div class="savebar"><button class="btn" onclick="saveSettings()">💾 저장하고 학생 화면에 적용</button> <button class="btn ghost" onclick="cancelSettings()">변경 취소</button> <span class="small">단계·모둠·주장·입장 방식이 저장돼요. 명단 등록은 위 버튼으로 바로 적용됩니다.</span></div></div>`;
 $('settings').innerHTML=h;renderStudentMgr();
}
function moveStage(i,d){const j=i+d;if(j<0||j>=DR.stages.length||DR.stages[i].id===0||DR.stages[j].id===0)return;[DR.stages[i],DR.stages[j]]=[DR.stages[j],DR.stages[i]];mark();renderSettings();}
function addGroup(){if(DR.groups.length>=MAX_GROUPS)return;DR.groups.push({n:DR.groups.length+1,size:4,claim:1});mark();renderSettings();}
function delGroup(){if(DR.groups.length<=1)return;const g=DR.groups[DR.groups.length-1];
 if(!confirm(`${g.n}모둠을 삭제할까요? 이미 ${g.n}모둠으로 접속한 학생은 모둠을 다시 골라야 해요.`))return;DR.groups.pop();mark();renderSettings();}
function startEditClaims(){DR.claims=clone(CLAIMS);mark();renderSettings();}
function resetClaims(){if(!confirm('편집한 주장·자료를 모두 지우고 기본 자료로 되돌릴까요? (저장 전까지는 학생 화면에 영향이 없어요)'))return;DR.claims=null;DR.groups.forEach(g=>{if(g.claim>CLAIMS.length)g.claim=1;});mark();renderSettings();}
function addClaim(){if(DR.claims.length>=MAX_CLAIMS)return;DR.claims.push({n:DR.claims.length+1,t:'',hint:'',src:[{type:'',title:'',body:''}]});mark();renderSettings();}
function delClaim(ci){if(DR.claims.length<=1)return;if(!confirm(`주장 ${ci+1}을(를) 삭제할까요?`))return;
 DR.claims.splice(ci,1);DR.claims.forEach((c,i)=>c.n=i+1);
 DR.groups.forEach(g=>{if(g.claim===ci+1)g.claim=1;else if(g.claim>ci+1)g.claim--;});mark();renderSettings();}
function addSrc(ci){const c=DR.claims[ci];if(c.src.length>=MAX_SRC)return;c.src.push({type:'',title:'',body:''});mark();renderSettings();}
function delSrc(ci,si){const c=DR.claims[ci];if(c.src.length<=1)return;c.src.splice(si,1);mark();renderSettings();}
async function saveSettings(){
 const CL=claimsOf(DR);
 for(const c of CL){if(!String(c.t).trim()){toast(`주장 ${c.n}의 AI 답변 문장이 비어 있어요`);return;}}
 DR.stages.forEach(s=>{s.name=String(s.name).trim()||DEFAULT_LESSON.stages.find(d=>d.id===s.id).name;});
 const r=await api('setLesson',{lesson:DR});
 if(r.ok){dirty=false;toast('저장했어요. 학생 화면에 곧 반영돼요');await refresh(true);}else toast(r.error==='too large'?'내용이 너무 길어요. 자료를 줄여 주세요':'저장하지 못했어요');
}
function cancelSettings(){if(dirty&&!confirm('저장하지 않은 변경을 버릴까요?'))return;dirty=false;DR=clone(LS);renderSettings();}
function parseRoster(text){const list=[],bad=[];
 text.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;const p=line.split(/[\s,;\t]+/).filter(Boolean);
  const g=parseInt(String(p[1]||'').replace(/[^\d]/g,''),10);if(p.length<2||!g||g<1||g>LS.groups.length)bad.push(line);else list.push({code:p[0],group:g});});
 return{list,bad};}
async function saveRoster(mode){
 const {list,bad}=parseRoster($('rosterText').value);
 if(bad.length){toast(`형식·모둠 번호가 맞지 않는 줄이 ${bad.length}개 있어요: ${bad[0]}`);return;}
 if(!list.length&&mode!=='replace'){toast('등록할 명단을 붙여 넣어 주세요');return;}
 if(mode==='replace'&&!confirm(list.length?`기존 명단을 지우고 ${list.length}명으로 교체할까요?`:'명단을 모두 비울까요?'))return;
 const r=await api('setRoster',{list,mode});
 if(r.ok){toast(`명단 ${r.count}명 등록됨`);$('rosterText').value='';refresh();}else toast('저장하지 못했어요');
}

/* ---- 내보내기 ---- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();}
const csvCell=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
const csv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function exportCSV(kind){
 if(kind==='students'){
  const head=['코드','모둠','제출시각','처음 판단','처음 이유','지금 판단','다짐(확인 절차)','전체 토의','피드백',...SELF.map((_,i)=>'자기평가'+(i+1))];
  const rows=DB.students.map(s=>{const d=s.data;return [s.code,s.group,s.submittedAt?new Date(s.submittedAt).toLocaleString('ko-KR'):'',d.pre,d.preWhy,d.post,d.reflect,d.discuss,d.feedback,...SELF.map((_,i)=>d['s'+(i+1)]?'O':'')];});
  download('학생응답.csv',csv([head,...rows]),'text/csv;charset=utf-8');
 }else{
  const K=[['g_verdict','판정'],['g_reason','근거 한 문장'],['g_rewrite','보고서용 문장'],['g_src','출처'],['g_acc','정확성'],['g_rel','신뢰성'],['g_speaker','발표자'],['g_recorder','기록자']];
  const rows=LS.groups.map(gr=>[gr.n+'모둠',(claimOfGroup(LS,gr.n)||{}).t||'',...K.map(([k])=>((DB.groups[gr.n]||{})[k]||{}).v||'')]);
  download('모둠기록지.csv',csv([['모둠','담당 주장',...K.map(k=>k[1])],...rows]),'text/csv;charset=utf-8');
 }
}
function exportJSON(){download('ai-verify-전체.json',JSON.stringify(DB,null,2),'application/json');}

/* ---- 타이머 ---- */
let tm=null,left=0;function startTimer(s){left=s;TOTAL=s;clearInterval(tm);tick();tm=setInterval(tick,1000);}function stopTimer(){clearInterval(tm);}
function tick(){const t=$('timer');t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');const txt=t.textContent,sv=$('stageTimer'),sb=$('stageBar');if(sv)sv.textContent=txt;if(sb&&TOTAL)sb.style.width=Math.max(0,Math.round(left/TOTAL*100))+'%';t.style.fontWeight=left<=30?'900':'';t.style.color=left<=30?'#a8875a':'';if(left<=0){clearInterval(tm);toast('시간이 끝났어요 ⏰');}left--;}

try{const p=sessionStorage.getItem(PIN_KEY);if(p&&API_URL){$('pin').value=p;login();}}catch(e){}
